# Checks that the scripts and sources are well-formed and, when a released SDK exists, builds the samples and runs
# the regression tests with it. Building the toolchain itself is the job of toolchain.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Syntax checks
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Shell scripts
        run: for f in setup.sh toolchain/*.sh tools/test.sh; do bash -n "$f"; done
      - name: Python tools
        run: python3 -m py_compile tools/*.py
      - name: Swift sources parse
        run: |
          swift --version
          for f in Package.swift Plugins/GBRom/GBRom.swift Sources/GameBoy/*.swift examples/*/main.swift tests/features/main.swift; do
            xcrun swiftc -parse "$f"
          done
      - name: Font.swift is up to date
        run: python3 tools/genfont.py /tmp/Font.swift && diff /tmp/Font.swift Sources/GameBoy/Font.swift

  test:
    name: Build samples with the released SDK
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install the latest released Swift SDK
        id: sdk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release download --repo "$GITHUB_REPOSITORY" --pattern 'swift-gameboy-*.artifactbundle.tar.gz' --dir sdk 2>/dev/null; then
            echo "No release with an SDK bundle yet; skipping."
            echo "available=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          swift sdk install sdk/swift-gameboy-*.artifactbundle.tar.gz
          swift sdk list
          echo "available=true" >> "$GITHUB_OUTPUT"
      - name: Regression tests
        if: steps.sdk.outputs.available == 'true'
        run: tools/test.sh
